[package]
name = "gachadata-server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
axum = "=0.8.9"
axum-tracing-opentelemetry = "=0.42.1"
bytes = "=1.12.1"
envy = "=0.4.2"
# JSON ログに OTel trace_id を注入する (tracing-subscriber 標準の JSON では出せない)
json-subscriber = { version = "=0.3.1", features = ["tracing-opentelemetry-0-34"] }
opentelemetry = "=0.33.1"
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "trace", "metrics", "reqwest-blocking-client"] }
opentelemetry_sdk = "=0.33.1"
# 継続プロファイリング (Grafana Pyroscope への push)。default の rustls-tls を使う
pyroscope = { version = "=2.1.2", features = ["backend-pprof-rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["full"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["catch-panic"] }
tracing = "=0.1.44"
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["std", "registry", "env-filter"] }

[dev-dependencies]
serde_json = "=1.0.154"
# メトリクスのテスト用 (InMemoryMetricExporter)
opentelemetry_sdk = { version = "=0.33.1", features = ["testing"] }
# テストで Router を oneshot で呼ぶ
tower = { version = "=0.5.3", features = ["util"] }
