name: Build and release
on:
  push:
    branches:
      - main

env:
  image_name: ghcr.io/giganticminecraft/gachadata-server

jobs:
  build-image:
    name: Build server docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    concurrency:
      group: ${{ github.ref }}-docker-build
      # 古い run の再実行が新しいコミットのビルドを cancel しないよう、キャンセルせず順に待つ
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # default branch のビルドで latest を付ける。ただし、この workflow の default branch 上の
      # 最新の run が別コミットのもの (古い run の再実行や、完了順の逆転) なら付けない。
      # 「branch の先頭コミットか」で判定すると、paths フィルタ等でこの workflow を起動しない
      # コミットが後に続いたとき latest が進まなくなるため、run の新しさで判定する
      - name: Decide whether to tag latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          enable=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            workflow_file=${GITHUB_WORKFLOW_REF%@*}
            workflow_file=${workflow_file##*/}
            if ! newest_sha=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow "${workflow_file}" \
                --branch "${DEFAULT_BRANCH}" --event push --limit 1 --json headSha --jq '.[0].headSha'); then
              # API が失敗しても sha タグのビルドは止めない。初回実行なら latest を付け、
              # 巻き戻りうる再実行では付けない
              echo "::warning::最新の run を取得できなかった (run_attempt=${GITHUB_RUN_ATTEMPT})"
              if [ "${GITHUB_RUN_ATTEMPT}" = 1 ]; then
                enable=true
              fi
            elif [ "${newest_sha}" = "${GITHUB_SHA}" ]; then
              enable=true
            else
              echo "::notice::より新しいコミット (${newest_sha}) の run があるので latest を付けない"
            fi
          fi
          echo "enable=${enable}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.image_name }}
          # latest は default branch のビルドでだけ付ける (条件は上の step)。seichi_infra のマニフェストは
          # latest@sha256:... で参照し、Renovate が digest の変化を追従する
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./server
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max
