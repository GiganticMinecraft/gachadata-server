name: Build and release
on:
  push:
    branches:
      - main

env:
  image_name: ghcr.io/giganticminecraft/gachadata-server

jobs:
  build-image:
    name: Build server docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    concurrency:
      group: ${{ github.ref }}-docker-build
      # 古い run の再実行が新しいコミットのビルドを cancel しないよう、キャンセルせず順に待つ
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 古い run の再実行や後から完了した run で latest が巻き戻らないよう、
      # default branch の先頭コミットのビルドでだけ latest を付ける
      - name: Check if this commit is the head of the default branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          is_head=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            # API が失敗しても sha タグのビルドは止めず、latest だけ付けない
            if ! head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha); then
              echo "::warning::default branch の先頭コミットを取得できなかったため latest を付けない"
            elif [ "${head_sha}" = "${GITHUB_SHA}" ]; then
              is_head=true
            fi
          fi
          echo "is_head=${is_head}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.image_name }}
          # latest は default branch 先頭のビルドでだけ付ける。seichi_infra のマニフェストは
          # latest@sha256:... で参照し、Renovate が digest の変化を追従する
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest,enable=${{ steps.head.outputs.is_head }}

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./server
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max
